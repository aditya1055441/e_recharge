services:
  postgres:
    image: postgres:16-alpine
    container_name: recharge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recharge_panel
      POSTGRES_USER: recharge_app
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - recharge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recharge_app -d recharge_panel"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recharge-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://recharge_app:local_dev_only_change_me@postgres:5432/recharge_panel
      JWT_SECRET: production-grade-secure-recharge-secret-key-32-chars
      CORS_ORIGIN: "http://localhost:4200,http://localhost"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recharge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  recharge_pgdata:
