<div class="login-wrapper">
  <div class="login-box">
    <div class="login-header">
      <div class="brand-badge">R</div>
      <h2>Recharge Control Center</h2>
      <p>Sign in to access your recharge dashboard</p>
    </div>

    <div class="card login-card-body">
      <div *ngIf="error()" class="alert-error">
        {{ error() }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Account Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="e.g. admin&#64;example.local"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="primary w-100" [disabled]="loading()">
          {{ loading() ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

        <div class="divider">
            <span>or</span>
        </div>
        <!-- Sign in with Google Button powered by Firebase -->
        <button type="button" class="google-btn w-100" (click)="signInWithGoogle()" [disabled]="loading()">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Sign in with Google</span>
        </button>



        <div class="quick-roles">
        <span class="quick-title">Quick Demo Logins:</span>
        <div class="role-buttons">
          <button type="button" class="tag-btn" (click)="setCredentials('admin@example.local')">Admin</button>
          <button type="button" class="tag-btn" (click)="setCredentials('api-manager@example.local')">API Mgr</button>
          <button type="button" class="tag-btn" (click)="setCredentials('master@example.local')">Master Dist</button>
          <button type="button" class="tag-btn" (click)="setCredentials('distributor@example.local')">Distributor</button>
          <button type="button" class="tag-btn" (click)="setCredentials('retailer@example.local')">Retailer</button>
          <button type="button" class="tag-btn google-tag" (click)="signInWithDemoGoogle()">Google Demo</button>
        </div>
      </div>
    </div>
  </div>
</div>
